<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גלריה - ניטור BMI והמלצות</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>
  <script src="Reg.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="img/icon5.png" alt="לוגו" height="60"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">בית</a></li>
          <li class="nav-item"><a class="nav-link" href="personalBMI.html">אזור אישי</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">המלצות</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">התנתקות</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="mb-4">מדידה חדשה וקבלת המלצות</h2>

    <div class="d-flex gap-2 justify-content-start mb-4">
        <button type="button" id="measureBtn" class="btn btn-primary px-5 py-2 shadow-sm fw-bold">התחלת מדידה וחישוב</button>
    </div>

    <form id="adviceForm" class="card p-4 shadow-sm border-0">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">גובה (ס"מ)</label>
          <input type="number" class="form-control bg-white" id="height" readonly placeholder=""> 
        </div>
        <div class="col-md-4">
          <label class="form-label">משקל (ק"ג)</label>
          <input type="number" id="weight" class="form-control bg-white" readonly placeholder=""> 
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">BMI מחושב</label>
          <input type="number" class="form-control bg-info text-white fw-bold" id="bmi" step="0.1" readonly required>
        </div>
      </div>

      <div class="row g-3 mt-3">
        <div class="col-md-6">
          <label for="diseasesText" class="form-label">מחלות רקע (מהפרופיל)</label>
          <input type="text" class="form-control bg-light" id="diseasesText" readonly>
        </div>
        <div class="col-md-6">
          <label for="goal" class="form-label">מטרה עיקרית</label>
          <select class="form-select" id="goal">
            <option value="שמירה על משקל">שמירה על משקל</option>
            <option value="ירידה במשקל">ירידה במשקל</option>
            <option value="עלייה במסת שריר">עלייה במסת שריר</option>
          </select>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success flex-grow-1 py-2">קבל המלצה מותאמת אישית</button>
        <button type="button" id="saveMeasureBtn" class="btn btn-outline-success px-4">שמור היסטוריה</button>
      </div>
    </form>

    <div id="adviceResult" class="alert alert-info d-none mt-4 animate__animated animate__fadeIn"></div>

    <div class="alert alert-warning mt-4 small">
      <strong>הערה:</strong> הנתונים מחושבים לפי הגדרות המערכת (Quartus VHDL) ואינם מחליפים ייעוץ רפואי.
    </div>
  </main>

  <script>
    let sensorValA = 0;
    let sensorValC = 0;
    let isMeasuring = false;

    // 1. טעינת נתוני משתמש
    firebase.auth().onAuthStateChanged((user) => {
      if (!user) { window.location.href = "login.html"; return; }
      firebase.database().ref("users/" + user.uid).once("value").then((snapshot) => {
        const data = snapshot.val();
        if (data) {
          document.getElementById('diseasesText').value = data.diseases ? 
            (Array.isArray(data.diseases) ? data.diseases.join(", ") : data.diseases) : "ללא";
          if (data.goal) document.getElementById('goal').value = data.goal;
        }
      });
    });

    // 2. האזנה שוטפת לחיישנים (ללא עדכון ה-UI עדיין)
    firebase.database().ref('fromAltera').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            if (data.A !== undefined) sensorValA = data.A;
            if (data.C !== undefined) sensorValC = data.C;
        }
    });

    // 3. פונקציית חישוב BMI לפי נוסחת ה-VHDL המדויקת
    function calcBMI() {
        const distRaw = sensorValA;
        const fsrRaw = sensorValC;
        const BASE_DIST = 26;

        let heightRaw = BASE_DIST - distRaw;
        if (heightRaw < 1) heightRaw = 1; 

        // נוסחה זהה ל-VHDL: (fsr * 4) / height
        let bmiResult = (fsrRaw * 4) / heightRaw; 

        // הגבלה לטווח 0-63 (כמו ב-VHDL)
        bmiResult = Math.min(63, Math.max(0, bmiResult));

        document.getElementById('bmi').value = bmiResult.toFixed(1);
        document.getElementById('height').value = distRaw;
        document.getElementById('weight').value = fsrRaw;
    }

    // 4. לוגיקת הכפתור המאוחד: מדידה -> המתנה -> איפוס
    document.getElementById('measureBtn').addEventListener('click', function() {
        if (isMeasuring) return;
        const btn = this;

        // בדיקת חיישן B (גובה תקין) לפני התחלה
        firebase.database().ref('fromAltera/B').once('value').then((snapshot) => {
            if (snapshot.val() < 40) {
                alert("שגיאה: החיישן אינו ממוקם נכון.");
                return;
            }

            isMeasuring = true;
            btn.disabled = true;
            let countdown = 3;
            btn.innerText = `מודד... (${countdown})`;

            // שליחת START (127) ל-FPGA
            firebase.database().ref('toAltera').set(127);

            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) btn.innerText = `מודד... (${countdown})`;
                else clearInterval(timer);
            }, 1000);

            setTimeout(() => {
                // ביצוע החישוב והצגת הערכים
                calcBMI();

                // שליחת RESET (64) מיד לאחר קבלת הערכים
                firebase.database().ref('toAltera').set(64).then(() => {
                    isMeasuring = false;
                    btn.disabled = false;
                    btn.innerText = "התחלת מדידה וחישוב";
                    alert("המדידה הושלמה והמערכת אופסה.");
                });
            }, 3000);
        });
    });

    // 5. המלצות לפי טווחי טבעת הלדים (VHDL)
    document.getElementById('adviceForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const bmi = parseFloat(document.getElementById('bmi').value);
        if (isNaN(bmi)) { alert("בצע מדידה תחילה"); return; }

        let status = "";
        let colorClass = "";

        // התאמה ללוגיקת הצבעים ב-VHDL (pos_tmp = bmi * 23 / 63)
        if (bmi <= 21.9) { // לדים 0-7: צהוב
            status = "BMI נמוך (צהוב במערכת). מומלץ להעשיר את התפריט בייעוץ תזונתי.";
            colorClass = "alert-warning";
        } else if (bmi <= 43.8) { // לדים 8-15: ירוק
            status = "BMI תקין (ירוק במערכת). כל הכבוד! המשך לשמור על אורח חיים בריא.";
            colorClass = "alert-success";
        } else { // לדים 16-23: אדום
            status = "BMI גבוה (אדום במערכת). מומלץ לשלב פעילות גופנית ותפריט מאוזן.";
            colorClass = "alert-danger";
        }

        const resultDiv = document.getElementById('adviceResult');
        resultDiv.className = `alert ${colorClass} mt-4 animate__animated animate__fadeIn`;
        resultDiv.innerHTML = `<strong>תוצאה:</strong> ${status}`;
        resultDiv.classList.remove('d-none');
    });

    // שמירה להיסטוריה
    document.getElementById('saveMeasureBtn').addEventListener('click', function() {
        const user = firebase.auth().currentUser;
        const bmi = document.getElementById('bmi').value;
        if (user && bmi) {
            firebase.database().ref("users/" + user.uid + "/history").push({
                bmi: parseFloat(bmi),
                date: new Date().toLocaleString('he-IL')
            }).then(() => alert("המדידה נשמרה בהיסטוריה!"));
        }
    });

    function logout() {
      firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
    }
  </script>
</body>
</html>
