<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גלריה - ניטור BMI והמלצות</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>
  <script src="Reg.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="img/icon5.png" alt="לוגו" height="60"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">בית</a></li>
          <li class="nav-item"><a class="nav-link" href="personalBMI.html">אזור אישי</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">המלצות</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">התנתקות</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="mb-4">מדידה חדשה וקבלת המלצות</h2>

    <div class="d-flex gap-2 justify-content-start mb-4">
        <button type="button" id="startMeasureBtn" class="btn btn-primary px-4 shadow-sm">התחלת מדידה</button>
        <button type="button" id="resetBtn" class="btn btn-danger px-4 shadow-sm">איפוס מערכת</button>
    </div>

    <form id="adviceForm" class="card p-4 shadow-sm border-0">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">גובה (ס"מ)</label>
          <input type="number" class="form-control bg-light" id="height" readonly placeholder="ממתין לחיישן..."> 
        </div>
        <div class="col-md-4">
          <label class="form-label">משקל (ק"ג)</label>
          <input type="number" id="weight" class="form-control bg-light" readonly placeholder="ממתין לחיישן..."> 
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">BMI מחושב</label>
          <input type="number" class="form-control bg-info text-white" id="bmi" step="0.1" readonly required>
        </div>
      </div>

      <div class="row g-3 mt-3">
        <div class="col-md-6">
          <label for="diseasesText" class="form-label" readonly >מחלות רקע (נמשך אוטומטית)</label>
          <input type="text" class="form-control" id="diseasesText" placeholder="טוען נתונים מהפרופיל...">
        </div>
        <div class="col-md-6">
          <label for="goal" class="form-label">מטרה עיקרית</label>
          <select class="form-select" id="goal">
            <option value="שמירה על משקל">שמירה על משקל</option>
            <option value="ירידה במשקל">ירידה במשקל</option>
            <option value="עלייה במסת שריר">עלייה במסת שריר</option>
          </select>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success flex-grow-1">קבל המלצה מותאמת אישית</button>
        <button type="button" id="saveMeasureBtn" class="btn btn-outline-success">שמור מדידה בהיסטוריה</button>
      </div>
    </form>

    <div id="adviceResult" class="alert alert-info d-none mt-4"></div>

    <div class="alert alert-warning mt-4 small">
      <strong>הערה:</strong> ההמלצות מבוססות על שקלול נתונים אוטומטי ואינן מחליפות ייעוץ רפואי מקצועי.
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-5">
    <p>© 2025 מערכת ניטור BMI | <a href="https://www.maccabi4u.co.il" target="_blank">מידע רפואי נוסף</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- 1. אבטחה ומשיכת נתונים אישיים ---
    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      // משיכת מחלות רקע ומטרה מה-Firebase של המשתמש
      const db = firebase.database();
      db.ref("users/" + user.uid).once("value").then((snapshot) => {
        const data = snapshot.val();
        if (data) {
          // מילוי מחלות רקע
          if (data.diseases) {
            document.getElementById('diseasesText').value = Array.isArray(data.diseases) ? data.diseases.join(", ") : data.diseases;
          }
          // בחירת המטרה ב-Select
          if (data.goal) {
            document.getElementById('goal').value = data.goal;
          }
        }
      });
    });

    // --- 2. האזנה לחיישני Altera (A ו-C) וחישוב BMI ---
    firebase.database().ref('fromAltera').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            if (data.A !== undefined) document.getElementById('height').value = data.A;
            if (data.C !== undefined) document.getElementById('weight').value = data.C;
            calcBMI();
        }
    });

    function calcBMI() {
        const distRaw = parseFloat(document.getElementById('height').value); // חיישן A
        const fsrRaw = parseFloat(document.getElementById('weight').value);  // חיישן C
        const BASE_DIST = 30;

        if (!isNaN(distRaw) && !isNaN(fsrRaw)) {
            let heightRaw = BASE_DIST - distRaw;
            if (heightRaw < 1) heightRaw = 1; 

            let bmiResult = (fsrRaw * 4) / heightRaw; // נוסחה מותאמת ל-Altera

            if (bmiResult > 63) bmiResult = 63;
            if (bmiResult < 0) bmiResult = 0;

            document.getElementById('bmi').value = bmiResult.toFixed(1);
        }
    }

    // --- 3. שליטה בחומרה (התחלה ואיפוס) ---
    document.getElementById('startMeasureBtn').addEventListener('click', function() {
        // בדיקת ערך B מהחיישן לפני התחלה
        firebase.database().ref('fromAltera/B').once('value').then((snapshot) => {
            const sensorB = snapshot.val();
            
            if (sensorB < 180) {
                alert("שגיאה: החיישן מרחק לא נמצא בגובה התקין (ערך נוכחי: " + sensorB + ")");
            } else {
                // אם תקין, שולחים 127 להתחלת מדידה
                firebase.database().ref('toAltera').set(127).then(() => {
                    alert("המדידה התחילה!");
                });
            }
        });
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
        // שליחת 64 לאיפוס
        firebase.database().ref('toAltera').set(64).then(() => {
            document.getElementById('bmi').value = '';
            alert("המערכת אופסה");
        });
    });

    // --- 4. הפקת המלצה (Advice) ---
    document.getElementById('adviceForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const bmi = parseFloat(document.getElementById('bmi').value);
        const conditions = document.getElementById('diseasesText').value;
        const goal = document.getElementById('goal').value;

        if (isNaN(bmi)) {
            alert("יש לבצע מדידה לפני קבלת המלצה");
            return;
        }

        let advice = `מבוסס על BMI של ${bmi}, מחלות רקע: ${conditions} ומטרה: ${goal}:\n`;
        if (bmi < 18.5) advice += "מומלץ להעשיר את התפריט בחלבונים ופחמימות מורכבות.";
        else if (bmi < 25) advice += "מצבך מצוין! המשך בתזונה מאוזנת ופעילות גופנית.";
        else advice += "מומלץ להפחית בסוכרים ולהגביר פעילות אירובית.";

        const resultDiv = document.getElementById('adviceResult');
        resultDiv.classList.remove('d-none');
        resultDiv.innerText = advice;
    });

    // --- 5. שמירה להיסטוריה ---
    document.getElementById('saveMeasureBtn').addEventListener('click', function() {
        const user = firebase.auth().currentUser;
        const bmi = document.getElementById('bmi').value;
        if (user && bmi) {
            firebase.database().ref("users/" + user.uid + "/history").push({
                bmi: parseFloat(bmi),
                date: new Date().toLocaleString('he-IL')
            }).then(() => alert("המדידה נשמרה בהצלחה!"));
        }
    });

    function logout() {
      firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
    }
  </script>
</body>
</html>
