<!DOCTYPE html>
<html lang="he">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התחברות / הרשמה - ניטור BMI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>
  <script src="Reg.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="img/icon5.png" alt="לוגו" height="60"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">בית</a></li>
          <li class="nav-item"><a class="nav-link" href="personalBMI.html">אזור אישי</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">התחברות</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">המלצות</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container my-5">
    <h2 class="mb-4">התחברות / הרשמה</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">שם מלא</label>
        <input type="text" class="form-control" id="nameX" required>
      </div>
      <div class="mb-3">
        <label for="birthYear" class="form-label">תאריך לידה</label>
        <input type="date" class="form-control" id="birthYear" required>
      </div>
      <div class="mb-3">
        <label class="form-label">מין</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
          <label class="form-check-label" for="male">זכר</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="female" value="female">
          <label class="form-check-label" for="female">נקבה</label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">מחלות רקע</label><br>

        <div class="form-check form-check-inline">
          <input class="form-check-input condition" type="checkbox" id="diabetes" value="סוכרת">
          <label class="form-check-label" for="diabetes">סוכרת</label>
        </div>

        <div class="form-check form-check-inline">
          <input class="form-check-input condition" type="checkbox" id="hypertension" value="לחץ דם גבוה">
          <label class="form-check-label" for="hypertension">לחץ דם גבוה</label>
        </div>

        <div class="form-check form-check-inline">
          <input class="form-check-input condition" type="checkbox" id="none" value="ללא">
          <label class="form-check-label" for="none">ללא</label>
        </div>
        <p>מחלות שנבחרו:</p>
        <div id="selectedConditions"></div>
      </div>
      </div>
      <div class="mb-3">
        <label for="about" class="form-label">אחר</label>
        <textarea class="form-control" id="about" rows="2"></textarea>
      </div>
      <div class="mb-3">
        <label for="goal" class="form-label">בחר מטרה עיקרית</label>
        <select class="form-select" id="goal">
          <option>שמירה על משקל</option>
          <option>ירידה במשקל</option>
          <option>עלייה במסת שריר</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Gmail</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">סיסמה</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <input type="button" value="save user" onclick="createUser();">
    </form>
    <div class="mt-4">
      <a href="index.html"><img src="img/icon5.png" alt="חזרה לדף הבית" height="40"></a>
    </div>

    <hr class="my-5">

    <h3 class="mb-4">משתמש רשום? התחבר</h3>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Gmail</label>
        <input type="email" class="form-control" id="loginEmail" required>
      </div>

      <div class="mb-3">
        <label class="form-label">סיסמה</label>
        <input type="password" class="form-control" id="loginPassword" required>
      </div>
      <input type="button" value="save user" onclick=" login()">
    </form>

  </main>
  <footer class="bg-light text-center py-3 mt-5">
    <div class="container">
      <p>© 2025 מערכת ניטור BMI</p>
      <h6 class="mt-3">מידע נוסף</h6>
      <ul class="list-unstyled">
        <li><a href="https://he.wikipedia.org/wiki/%D7%9E%D7%93%D7%93_%D7%9E%D7%A1%D7%AA_%D7%92%D7%95%D7%A3"
            target="_blank">ערך BMI בוויקיפדיה</a></li>
        <li><a href="https://www.maccabi4u.co.il/maccabi_circles/healthy-and-tasty/bmi_calculator/"
            target="_blank">מחשבון BMI של מכבי</a></li>
      </ul>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  const checkboxes = document.querySelectorAll('.condition');
  const output = document.getElementById('selectedConditions');

  checkboxes.forEach(cb => {
    cb.addEventListener('change', showSelectedConditions);
  });

  function showSelectedConditions() {
    const selected = [];

    checkboxes.forEach(cb => {
      if (cb.checked) {
        selected.push(cb.value);
      }
    });

    if (selected.length > 0) {
      output.innerText = selected.join(', ');
    } else {
      output.innerText = 'לא נבחרו מחלות';
    }
  }

  firebase.auth().onAuthStateChanged((user) => {
  if (user) {
    // אם המשתמש כבר מחובר, העבר אותו ישר לאזור האישי
    window.location.href = "personalBMI.html";
  }
});
</script>
</body>

</html>
